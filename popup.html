<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LitbuyTools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-brand">
        <div class="app-brand-mark">
          <img src="icons/icon48.png" alt="LitbuyTools icon" class="app-brand-icon">
        </div>
        <div class="app-brand-copy">
          <h1>LitbuyTools</h1>
          <div class="app-brand-meta">
            <span class="version-badge" id="version-tag">v1.0</span>
            <span class="author-badge">by Farlapata</span>
          </div>
        </div>
      </div>
      <button class="icon-btn" id="repo-link-btn" type="button" title="Open project page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M10.59 13.41a1 1 0 0 1 0-1.41l2.41-2.41a3 3 0 1 1 4.24 4.24l-2.12 2.12a3 3 0 0 1-4.24 0 1 1 0 1 1 1.41-1.41 1 1 0 0 0 1.42 0l2.12-2.12a1 1 0 0 0-1.42-1.42l-2.41 2.41a1 1 0 0 1-1.41 0Z"/>
          <path d="M13.41 10.59a1 1 0 0 1 0 1.41L11 14.41a3 3 0 0 1-4.24-4.24l2.12-2.12a3 3 0 0 1 4.24 0 1 1 0 1 1-1.41 1.41 1 1 0 0 0-1.42 0l-2.12 2.12a1 1 0 1 0 1.42 1.42l2.41-2.41a1 1 0 0 1 1.41 0Z"/>
        </svg>
      </button>
    </header>

    <div class="update-banner hidden" id="update-banner">
      <div class="update-banner-text" id="update-banner-text"></div>
      <button class="update-banner-btn" id="update-banner-btn" type="button">View Update</button>
    </div>

    <nav class="top-tabs" aria-label="Primary">
      <button class="top-tab is-active" id="tools-tab-btn" data-tab="tools" type="button">Tools</button>
      <button class="top-tab" id="system-tab-btn" data-tab="system" type="button">System</button>
    </nav>

    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search tools">
    </div>

    <main class="main-content">
      <section class="view is-active" id="tools-view"></section>
      <section class="view" id="system-view"></section>
    </main>

    <section class="detail-view hidden" id="detail-view">
      <div class="detail-scroll">
        <div class="detail-header">
          <button class="back-btn" id="detail-back-btn" type="button" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
          </button>
          <div class="detail-title-group">
            <div class="detail-breadcrumb" id="detail-breadcrumb"></div>
            <div class="detail-eyebrow" id="detail-category"></div>
            <h2 id="detail-title">Configure Tool</h2>
          </div>
        </div>
        <div class="detail-description" id="detail-description"></div>
        <div class="detail-content" id="detail-content"></div>
      </div>
    </section>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
